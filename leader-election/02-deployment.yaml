##############################################################################
# Deployment – leader-elector
#
# Demonstrates the sidecar leader election pattern.
# The app-stub container depends on the sidecar-elector to determine
# if it is the current leader.
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leader-elector
  namespace: leader-election
  labels:
    app.kubernetes.io/name: leader-elector
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: leader-election
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: leader-elector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leader-elector
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: leader-election
    spec:
      serviceAccountName: leader-elector
      containers:
        - name: app-stub
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["/bin/sh", "/scripts/run.sh"]
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
        - name: sidecar-elector
          image: instana/leader-elector:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              /app/server --id=$(/app/hostname) \
              --election=test-lock \
              --election-namespace=leader-election \
              --http=0.0.0.0:4040
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: script-vol
          configMap:
            name: leader-elector-script
