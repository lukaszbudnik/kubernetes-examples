##############################################################################
# kustomization.yaml
#
# Apply everything at once:
#   kubectl apply -k .
##############################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: leader-election

resources:
  - 00-namespace.yaml
  - 01-configmap-lease-script.yaml
  - 02-deployment.yaml
  - 03-rbac.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: leader-election
    includeSelectors: true
