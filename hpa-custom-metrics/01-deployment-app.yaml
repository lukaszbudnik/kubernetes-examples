apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: hpa-custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: main
        image: busybox
        command: ["sh", "-c", "while true; do echo 'Processing...'; sleep 10; done"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
