apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pod
  namespace: flock
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: flock
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: flock
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker-container
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["/bin/sh", "/scripts/worker.sh"]
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: script-vol
          configMap:
            name: worker-script
